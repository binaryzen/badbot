name: rate_limit_probe
description: >
  Authenticate via OAuth client credentials, then flood an authenticated
  endpoint with repeated requests. Expects the server to respond with 429
  Too Many Requests after some threshold. If no 429 is observed across all
  iterations, rate limiting is not enforced.

ttp_mappings:
  - technique_id: T1499
    sub_technique_id: "002"
    owasp_alias: "API4:2023"
    confidence: partial   # probing absence of defense, not executing a sustained flood

inputs:
  - name: client_id
    default: client_app
    description: OAuth client_credentials client ID
  - name: client_secret
    default: client_secret_123
    description: OAuth client_credentials client secret
    sensitive: true

steps:
  - name: authenticate
    method: POST
    path: /oauth/token
    body_format: form
    body:
      grant_type: client_credentials
      client_id: "{ctx:client_id}"
      client_secret: "{ctx:client_secret}"
      scope: "read:orders"
    extract:
      - field: "$.access_token"
        into: access_token
    expect_status: 200
    on_success: flood_endpoint

  - name: flood_endpoint
    method: GET
    path: /api/orders
    headers:
      Authorization: "Bearer {ctx:access_token}"
    repeat: 15
    loop_finding:
      expect_status: 429
      finding:
        severity: MEDIUM
        urn: "urn:badbot:poc:msg:rate_limit_not_enforced"
        params: {}
